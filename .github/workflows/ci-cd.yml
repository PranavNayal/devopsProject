name: TaskBoard CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: backend
        run: pytest -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

  build-scan-push:
    name: Build, Scan & Push Containers
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Repository Owner
        id: prep
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build -t ghcr.io/${{ steps.prep.outputs.owner }}/taskboard-backend:${{ github.sha }} ./backend

      - name: Build Frontend Image
        run: |
          docker build -t ghcr.io/${{ steps.prep.outputs.owner }}/taskboard-frontend:${{ github.sha }} ./frontend

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: ghcr.io/${{ steps.prep.outputs.owner }}/taskboard-backend:${{ github.sha }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: ghcr.io/${{ steps.prep.outputs.owner }}/taskboard-frontend:${{ github.sha }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Push Container Images to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ steps.prep.outputs.owner }}/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ steps.prep.outputs.owner }}/taskboard-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes with Helm
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Repository Owner
        id: prep
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint ./helm/taskboard

      - name: Configure kubectl
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config

      - name: Deploy with Helm
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        run: |
          helm upgrade --install taskboard ./helm/taskboard \
            --namespace taskboard \
            --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ steps.prep.outputs.owner }}/taskboard-backend \
            --set frontend.image=ghcr.io/${{ steps.prep.outputs.owner }}/taskboard-frontend
