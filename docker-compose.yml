services:
  postgres:
    image: postgres:16-alpine
    container_name: flowboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowboard
      POSTGRES_USER: flowboard
      POSTGRES_PASSWORD: flowboard
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowboard -d flowboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: flowboard-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://flowboard:flowboard@postgres:5432/flowboard
    networks:
      default:
        aliases:
          - flowboard-backend
          - backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: flowboard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  postgres-data:
