apiVersion: apps/v1
kind: Deployment
metadata: {name: flowboard-broken-image, namespace: flowboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-image}}
  template:
    metadata: {labels: {app: broken-image}}
    spec:
      containers: [{name: backend, image: ghcr.io/example/flowboard-backend:does-not-exist}]
