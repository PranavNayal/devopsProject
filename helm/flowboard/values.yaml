frontend:
  image: ghcr.io/pranavnayal/flowboard-frontend
  tag: latest
backend:
  image: ghcr.io/pranavnayal/flowboard-backend
  tag: latest
replicaCount: 2
namespace: flowboard
imagePullSecrets: []
postgres:
  host: flowboard-postgres
  database: flowboard
  username: flowboard
  password: flowboard
ingress:
  enabled: false
  host: flowboard.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
monitoring:
  serviceMonitor:
    enabled: false
